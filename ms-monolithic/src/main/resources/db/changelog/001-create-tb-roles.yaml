databaseChangeLog:
  - changeSet:
      id: 001-create-tb-roles
      author: douglas
      changes:
        - createTable:
            tableName: tb_roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
